[package]
name = "utmost-cli"
version = "0.2.2"
edition = "2024"
description = "Command-line interface for Utmost file carving tool"
license = "MIT OR Apache-2.0"

[[bin]]
name = "utmost"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:utmost-gui"]

[dependencies]
utmost-lib = { path = "../utmost-lib", version = "0.2.2" }
utmost-gui = { path = "../utmost-gui", optional = true }
anyhow = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
indicatif = { workspace = true }
num_cpus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sysinfo = "0.37"
gethostname = "1.1"
libc = "0.2"
dirs = "5"
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
